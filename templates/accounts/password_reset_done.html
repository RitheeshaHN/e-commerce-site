{% extends "base.html" %}
{% block title %}Email sent | StepUp Footwear{% endblock %}

{% block content %}
<div class="container page auth-page">
  <div class="auth-card center">
    <h1>📬 Check your inbox</h1>
    <p class="muted">If an account exists for that email, a password reset link has been sent.</p>

  </div>
</div>
{% endblock %}
